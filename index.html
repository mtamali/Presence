<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what activates env(safe-area-inset-*), which the
         stylesheets already use in five places. Without it those insets
         resolve to 0 and the bottom nav sits under the Android gesture bar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2a2218" />
    <meta name="description" content="Course attendance for 1MAUT, 1MESE, and 4IGEI." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Présence — Student attendance</title>
    <!-- Fonts are bundled through src/styles/index.css, not fetched here. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
